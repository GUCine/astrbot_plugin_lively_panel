<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>〈标题〉</title>
<link rel="preload" href="/static/font/rt.woff2?v=1028" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/static/favicon.png?v=1102">

<!-- 极客模式开着就在第一帧前换皮，免得先闪一下纸；网址带 ?geek=1 / ?geek=0 直接开、关 -->
<script>(function(){var h=document.documentElement,q=/[?&]geek=([01])/.exec(location.search),on;try{if(q)localStorage.setItem("lively.geek",q[1]);on=localStorage.getItem("lively.geek")==="1"}catch(e){on=!!q&&q[1]==="1"}if(on){h.classList.add("geek");try{h.dataset.gc=localStorage.getItem("lively.geek.c")==="green"?"green":"blue"}catch(e){}}})()</script>
<style>
@font-face{font-family:"Ruantang";src:url(/static/font/rt.woff2?v=1028) format("woff2");font-display:swap}
@font-face{font-family:"RuantangFull";src:url(/static/font/rt-full.woff2?v=1028) format("woff2");font-display:swap}
/* 一套设计记号：颜色、圆角、阴影、间距都从这里取，组件里不再写死 */
:root{
  --ink:#1c2b66; --soft:#56659a; --faint:#8a97b8; --hair:#2f5fd0; --tip:#8ec9f2; --blush:#e7799b;
  --paper:rgba(255,255,255,.95); --field:#f3f7fd; --rule:#dfe8f5; --line:rgba(28,43,102,.08); --edge:rgba(16,30,90,.12);
  --brand-soft:#e9f1fe; --blush-soft:#fdecf2;
  --tape-a:rgba(243,163,189,.62); --tape-b:rgba(142,201,242,.65);
  --good:#2b9a6e; --warn:#c98a12; --bad:#d8506f;
  --good-soft:#e5f5ee; --warn-soft:#fbf1dc; --bad-soft:#fce8ed;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --sh-card:0 1px 2px rgba(8,20,70,.06),0 10px 28px -6px rgba(8,20,70,.2),0 0 0 1px rgba(255,255,255,.6) inset;
  --sh-pop:0 14px 40px -8px rgba(8,20,70,.35);
  --glass:rgba(255,255,255,.16); --glass-line:rgba(255,255,255,.32);
  --body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --hand:"Ruantang","RuantangFull",-apple-system,"PingFang SC",sans-serif;
  --side:24px; --top:132px; --bottom:116px;
  /* 两侧的纸跟着屏幕变宽：正中间留够她（448）和一点空，剩下的两边分；最窄 330、最宽 540 */
  --col:clamp(330px, calc((100vw - 448px - 2 * var(--side) - 56px) / 2), 540px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font:14px/1.6 var(--body);background:#0c1a4a;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;text-spacing-trim:trim-start;text-wrap:pretty}  /* 数字等宽好对齐；行首的「【」不往里缩；最后一行不剩一个字 */
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hair);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
[hidden]{display:none!important}

/* ---------- 背景：她的内心海（WebGL 水光）+ 泡泡 ---------- */
#water,#fizz{position:fixed;inset:0;width:100%;height:100%;display:block}
#fizz{pointer-events:none}

/* ---------- 顶栏：左边招牌，右边状态 ---------- */
body > header{position:fixed;left:var(--side);right:var(--side);top:16px;height:52px;display:flex;align-items:center;gap:14px;z-index:20;color:#fff;pointer-events:none}
body > header > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;margin:0;font:24px/1 var(--hand);font-weight:normal;text-shadow:0 2px 12px rgba(10,20,60,.35)}
.brand-mark{width:42px;height:42px;background:url(/static/icon.png?v=1102) center/contain no-repeat;filter:drop-shadow(0 2px 6px rgba(10,20,60,.35))}
.brand small{display:block;font:12px/1.4 var(--body);opacity:.8;margin-top:4px;letter-spacing:.04em}
.hud{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 14px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);
  backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);font-size:12.5px;font-weight:600;white-space:nowrap}
/* 隐私模式（privacy.js）：文字由脚本换成代号或包上 .pv-b，这里管模糊和头像、配图 */
.pv-btn{cursor:pointer;gap:6px;font-family:inherit;color:inherit}
.pv-btn .ic{width:16px;height:16px;fill:none}
.pv-btn .pv-slash{opacity:0;transition:opacity .2s}
.pv-btn[aria-pressed="true"]{background:rgba(255,255,255,.88);color:#c24a73;border-color:rgba(231,121,155,.6)}
.pv-btn[aria-pressed="true"] .pv-slash{opacity:1}
.solo-btn{cursor:pointer;gap:6px;font-family:inherit;color:inherit}
.solo-btn .ic{width:16px;height:16px}
.solo-btn .so-side{transition:opacity .2s}
.solo-btn[aria-pressed="true"]{background:rgba(255,255,255,.88);color:#2f5fd0;border-color:rgba(47,95,208,.45)}
.solo-btn[aria-pressed="true"] .so-side{opacity:0}
/* 只看她：两边的信息淡出去、点不到；她和对话框不动 */
#left,#right,#kpi,#dock,#field,.ring-layer,.more{transition:opacity .35s ease,visibility 0s linear 0s}
html.solo :is(#left,#right,#kpi,#dock,#field,.ring-layer,.more){opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s ease,visibility 0s linear .35s}
@media (prefers-reduced-motion:reduce){#left,#right,#kpi,#dock,#field,.ring-layer,.more{transition:none!important}}
/* 只看她时右下角的放大缩小 */
#zoomCtl{display:none}
html.solo #zoomCtl{display:flex;position:fixed;right:24px;bottom:24px;z-index:30;align-items:center;gap:2px;padding:3px;border-radius:999px;
  border:1px solid var(--glass-line);background:rgba(18,42,118,.32);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 14px -6px rgba(8,20,70,.5)}
#zoomCtl button{min-width:30px;height:28px;padding:0 8px;border:0;border-radius:999px;background:none;color:#fff;font:600 14px/1 inherit;cursor:pointer}
#zoomCtl .zp{min-width:54px;font-size:12px;font-variant-numeric:tabular-nums}
#zoomCtl button:hover:not(:disabled){background:rgba(255,255,255,.18)}
#zoomCtl button:disabled{opacity:.35;cursor:default}
#zoomCtl button:focus-visible{outline:2px solid #fff;outline-offset:1px}
@media (max-width:520px){.pv-btn span,.solo-btn span{display:none}.pv-btn,.solo-btn{padding:0 9px}.hud{gap:6px}#online > span:not(.dot){display:none}}
@media (max-width:420px){.brand > span:not(.brand-mark){display:none}}  /* 右上角按钮多，最窄的手机上标题只留图标 */
.pv-b,.pv-bb{filter:blur(5px);-webkit-user-select:none;user-select:none;pointer-events:none}
html.pv #thought .pv-b{filter:blur(4px)}
html.pv img[src*="qlogo.cn"],html.pv img[src*="/api/avatar/"],html.pv img[src*="/api/madeav/"],html.pv img[src*="/api/image"],html.pv image[href*="qlogo.cn"],html.pv image[href*="/api/avatar/"],html.pv image[href*="/api/madeav/"]{filter:blur(7px) saturate(.85)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#7fe0b0;box-shadow:0 0 0 3px rgba(127,224,176,.25)}
.pill.off .dot{background:#ff8aa5;box-shadow:0 0 0 3px rgba(255,138,165,.25)}
.pill b{font:16px/1 var(--hand);font-weight:normal}

/* ---------- 脑区抬头：这个脑区叫什么 + 几个一眼看懂的数 ---------- */
#kpi{position:fixed;left:var(--side);right:var(--side);top:78px;z-index:15;display:flex;align-items:stretch;gap:10px;color:#fff;pointer-events:none}
#kpi > *{pointer-events:auto}
.kpi-name{display:flex;flex-direction:column;justify-content:center;min-width:0;width:min(var(--col),330px);flex:none;padding:0 4px 0 0}  /* 左边和底下卡片的边对齐 */
.kpi-name b{font:26px/1.1 var(--hand);font-weight:normal;text-shadow:0 2px 12px rgba(8,20,70,.45)}
.kpi-name small{font-size:12.5px;opacity:.92;text-shadow:0 1px 6px rgba(8,20,70,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis{flex:1;display:flex;justify-content:center;gap:8px;min-width:0}
.kpi{display:flex;flex-direction:column;justify-content:center;min-width:0;max-width:170px;flex:0 1 150px;padding:7px 14px 6px;border-radius:14px;text-shadow:0 1px 6px rgba(8,20,70,.3);
  background:linear-gradient(rgba(18,42,118,.3),rgba(18,42,118,.18));border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3);
  box-shadow:0 6px 18px -8px rgba(8,20,70,.35)}
.kpi small{font-size:11.5px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{font:22px/1.15 var(--hand);font-weight:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b i{font:12px var(--body);font-style:normal;opacity:.85;margin-left:3px}
.kpi.warn{background:linear-gradient(rgba(201,120,18,.5),rgba(201,120,18,.32));border-color:rgba(255,214,160,.6)}
.kpi.bad{background:linear-gradient(rgba(216,80,111,.55),rgba(216,80,111,.36));border-color:rgba(255,170,190,.6)}
.kpi-pad{width:min(var(--col),330px);flex:none}

/* ---------- 正中间的她 ---------- */
/* Live2D 的她（l2d.js）：露上半身，呆毛尖被顶上那排数字盖住一点，腰往下淡进托盘后面；两边的纸可以盖住一点头发 */
#stage{position:fixed;left:0;right:0;top:0;bottom:0;width:min(820px,calc(100vw - 2 * var(--side)));margin:0 auto;z-index:6}  /* 别用 transform 居中：泡泡在里面、是 fixed，会跟着变 */
#pet{position:absolute;inset:0;cursor:pointer;border:0;background:none;padding:0;transform-origin:50% 30%}
#pet canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;
  -webkit-mask:linear-gradient(#000 72%,transparent 96%);mask:linear-gradient(#000 72%,transparent 96%)}
/* 她想的话像文字游戏的对话框：放在立绘下半身前面、半透明，左上角挂名牌，右下角一个一闪一闪的小三角；极客模式另有样子，不动它 */
html:not(.geek) #thought{top:auto;bottom:calc(var(--bottom) + 14px);transform:translateX(-50%);z-index:12;
  width:min(620px,calc(100vw - 2 * var(--col) - 2 * var(--side) - 20px));max-width:none;min-height:86px;padding:24px 28px 18px;
  border-radius:16px;text-align:left;font-size:15.5px;line-height:1.75;color:var(--ink);
  background:linear-gradient(rgba(255,255,255,.72),rgba(240,246,255,.62));-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3);
  border:1px solid rgba(255,255,255,.85);box-shadow:0 14px 36px -6px rgba(10,24,80,.3),0 0 0 4px rgba(255,255,255,.18)}
html:not(.geek) #thought::before{content:"〈名字〉";width:auto;height:auto;left:20px;top:-15px;bottom:auto;padding:4px 16px 3px;border-radius:999px;
  background:linear-gradient(135deg,var(--hair),#5b8cf0);color:#fff;font:16px/1.3 var(--hand);letter-spacing:.06em;box-shadow:0 4px 12px -2px rgba(20,50,150,.45)}
html:not(.geek) #thought::after{width:0;height:0;left:auto;right:18px;bottom:12px;border-radius:0;background:none;border:6px solid transparent;border-top:8px solid var(--blush);
  animation:vn-next 1.1s ease-in-out infinite}
html:not(.geek) #thought small{margin-top:4px}
@keyframes vn-next{50%{transform:translateY(4px);opacity:.55}}
/* 极客模式的思考泡泡（纸面的是上面的对话框）：在她头顶 */
#thought{position:fixed;left:50%;top:calc(50% - 132px);transform:translate(-50%,-100%);width:max-content;max-width:min(420px,calc(100vw - 2 * var(--col) - 2 * var(--side) - 40px));min-height:48px;
  padding:12px 22px 13px;border-radius:26px;background:rgba(255,255,255,.96);color:var(--ink);font-size:15px;line-height:1.55;text-align:center;
  box-shadow:0 10px 30px rgba(10,24,80,.25);z-index:2}
#thought::before,#thought::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.96)}
#thought::before{width:16px;height:16px;left:calc(50% + 34px);bottom:-14px}
#thought::after{width:9px;height:9px;left:calc(50% + 46px);bottom:-27px}
#thought .who{font-weight:700}
#thought .caret{display:inline-block;width:2px;height:1em;background:var(--blush);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
#thought small{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
@keyframes blink{50%{opacity:0}}

/* ---------- 底部：脑区泡泡，放在一条玻璃托盘上 ---------- */
#dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:14px;align-items:flex-end;z-index:20;padding:10px 20px 10px;border-radius:30px;
  background:linear-gradient(rgba(255,255,255,.1),rgba(255,255,255,.18));border:1px solid rgba(255,255,255,.28);
  backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 12px 32px -10px rgba(8,20,70,.45)}
.orb{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:5px;width:62px;border:0;background:none;cursor:pointer;color:#fff;padding:0}
.orb i{position:relative;display:grid;place-items:center;width:50px;height:50px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 6%,rgba(255,255,255,.25) 14%,rgba(255,255,255,.08) 55%,rgba(255,255,255,.22) 100%);
  border:1.5px solid rgba(255,255,255,.55);box-shadow:inset 0 -6px 14px rgba(255,255,255,.16),0 6px 18px rgba(8,20,70,.22);transition:background .3s,width .3s,height .3s}
.orb i .ic{width:22px;height:22px;stroke-width:1.7}
.orb span{font:13.5px/1 var(--hand);text-shadow:0 1px 8px rgba(8,20,70,.5);white-space:nowrap;opacity:.9}
.orb small{position:absolute;top:-6px;right:0;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--blush);color:#fff;font:600 11.5px/20px var(--body);box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.orb small.bad{background:var(--bad)}
.orb:hover i{background:radial-gradient(circle at 32% 28%,#fff 0 6%,rgba(255,255,255,.35) 14%,rgba(255,255,255,.14) 55%,rgba(255,255,255,.3) 100%)}
.orb[aria-current="true"] i{width:62px;height:62px;border-color:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.18),0 0 30px rgba(255,255,255,.5),0 8px 20px rgba(8,20,70,.3)}
.orb[aria-current="true"] span{font-size:15px;opacity:1}

/* ---------- 两侧：从她脑子里飘出来的纸 ---------- */
.col{position:fixed;top:var(--top);bottom:var(--bottom);width:var(--col);z-index:10;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:transparent transparent;padding:14px 8px 24px;perspective:1200px;
  display:flex;flex-direction:column;gap:16px;-webkit-mask:linear-gradient(transparent,#000 12px,#000 calc(100% - 24px),transparent);mask:linear-gradient(transparent,#000 12px,#000 calc(100% - 24px),transparent)}
.col:hover{scrollbar-color:rgba(255,255,255,.45) transparent}
.col::-webkit-scrollbar{width:6px}.col::-webkit-scrollbar-thumb{border-radius:3px;background:transparent}.col:hover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.45)}
#left{left:calc(var(--side) - 8px)}#right{right:calc(var(--side) - 8px)}

/* 卡片：抬头（图标 + 标题 + 说明 + 右边的小数或切换）、正文、底下的按钮 */
/* 纸本来就几乎不透明，不再给每张纸做背景模糊：长卡片叠在一直在动的水光上每帧都要重新模糊，会闪、会卡 */
.card{position:relative;flex:none;background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--sh-card)}
.card-h{display:flex;align-items:flex-start;gap:10px;padding:15px 18px 0}
.card-ic{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--brand-soft);color:var(--hair)}
.card-ic .ic{width:17px;height:17px}
.card.pink .card-ic{background:var(--blush-soft);color:var(--blush)}
/* QQ 掉线：红边的纸，放在最上面 */
.card.alarm{box-shadow:var(--sh-card),inset 0 0 0 2px color-mix(in srgb,var(--bad) 45%,transparent)}
.card.alarm .card-ic{background:var(--bad-soft);color:var(--bad)}
.card.alarm h2{color:var(--bad)}
.off-p{margin:0;font-size:13.5px;line-height:1.6}
.off-p b{color:var(--bad)}
.pill.off{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.card-t{flex:1;min-width:0}
.card h2{font:18px/1.3 var(--hand);font-weight:normal;margin:1px 0 0}
.card-t p{margin:1px 0 0;color:var(--faint);font-size:12px;line-height:1.45}
.card-m{flex:none;margin-left:auto;font-size:12px;color:var(--faint);padding-top:5px;white-space:nowrap}
.card-m b{font:17px/1 var(--hand);font-weight:normal;color:var(--hair)}
.card-b{padding:12px 18px 16px}
.card-f{display:flex;flex-wrap:wrap;gap:6px;padding:12px 18px 14px;border-top:1px solid var(--line);background:linear-gradient(rgba(243,247,253,.6),rgba(243,247,253,.9));border-radius:0 0 var(--r-lg) var(--r-lg)}
/* 纸胶带：每一列只贴第一张，当作这一列的记号 */
.card .tp{position:absolute;z-index:2;top:-9px;left:22px;width:74px;height:20px;background:var(--tape-a);transform:rotate(-4deg);
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 2px,transparent 2px 7px);box-shadow:0 1px 2px rgba(8,20,70,.12);
  -webkit-mask:conic-gradient(from -45deg at left,#0000 25%,#000 0) left/51% 5px repeat-y,conic-gradient(from 135deg at right,#0000 25%,#000 0) right/51% 5px repeat-y;
  mask:conic-gradient(from -45deg at left,#0000 25%,#000 0) left/51% 5px repeat-y,conic-gradient(from 135deg at right,#0000 25%,#000 0) right/51% 5px repeat-y}
.card.b .tp{left:auto;right:24px;background-color:var(--tape-b);transform:rotate(4deg)}
/* 卡片里的分页（像分段按钮）：内容多的卡片不往下堆，分成几页 */
.seg{display:flex;gap:2px;margin:12px 18px 0;padding:3px;border-radius:10px;background:var(--field);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{flex:1;min-width:0;border:0;background:none;padding:5px 8px;border-radius:8px;font-size:12.5px;color:var(--soft);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(16,30,90,.14)}
.seg button em{font-style:normal;font-size:11px;color:var(--faint);margin-left:3px;font-weight:400}

.muted{color:var(--soft)}.small{font-size:12.5px}
.sec{font:13px/1.2 var(--body);font-weight:600;color:var(--soft);margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.sec:first-child{margin-top:0}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
/* 小标签：浅底色、带一颗点 */
.chip,.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:1.6;padding:0 8px;border-radius:999px;background:var(--field);color:var(--soft);margin:2px 4px 2px 0;white-space:nowrap}
.chip.no,.tag.bad{color:var(--bad);background:var(--bad-soft)}
.tag.good{color:var(--good);background:var(--good-soft)}.tag.warn{color:var(--warn);background:var(--warn-soft)}.tag.blue{color:var(--hair);background:var(--brand-soft)}
.tag.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--m,currentColor)}
.n{font:20px/1 var(--hand);color:var(--hair);padding:0 .08em}
.big{font:34px/1.1 var(--hand);color:var(--hair)}

/* 数字块：标签、大数、一句说明（2×2 排） */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{padding:10px 12px 9px;border-radius:var(--r-md);background:var(--field);min-width:0}
.stat small{display:block;font-size:12px;color:var(--soft)}
.stat b{display:block;font:24px/1.2 var(--hand);font-weight:normal;color:var(--hair);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat p{margin:1px 0 0;font-size:11.5px;color:var(--faint);line-height:1.4}
.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}
/* 刻度条：名字、一根条、数、底下一句话 */
.meter{display:grid;grid-template-columns:3.6em 1fr minmax(4.4em,max-content);gap:2px 10px;align-items:center;padding:8px 0}  /* 数那一栏定宽，几条一样长 */
.meter + .meter{border-top:1px solid var(--line)}
.meter b{font:15px/1 var(--hand);font-weight:normal}
.meter .bar{position:relative;height:8px;border-radius:4px;background:var(--field);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.meter .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--tip),var(--hair))}
.meter .bar.warm i{background:linear-gradient(90deg,#f6c98a,#e9724f)}
.meter em{font-style:normal;font:16px/1 var(--hand);color:var(--hair);white-space:nowrap;text-align:right}
.meter .bar.warm + em{color:#e9724f}
.meter p{grid-column:2/-1;margin:0;font-size:12px;color:var(--faint);line-height:1.45}
/* 排行条：底下垫一条长短不同的色带，名字和数压在上面 */
.blist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:4px}  /* 名字长的不把整列撑出卡片 */
.blist li{position:relative}
.blist .row{position:relative;display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:4px 10px 4px 6px;border:0;border-radius:var(--r-sm);background:none;text-align:left;cursor:default;isolation:isolate}
.blist button.row{cursor:pointer}.blist button.row:hover{background:var(--field)}
.blist .bf{position:absolute;left:0;top:0;bottom:0;width:calc((100% - var(--nw,0px) - 18px) * var(--w,0));border-radius:var(--r-sm);background:color-mix(in srgb,var(--c,var(--tip)) 20%,transparent);box-shadow:inset -2px 0 0 color-mix(in srgb,var(--c,var(--tip)) 55%,transparent);z-index:-1}
.blist img{width:24px;height:24px;border-radius:50%;flex:none}
.blist .lb{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blist .lb small{color:var(--faint);font-size:11.5px;margin-left:6px}
.blist em{flex:none;min-width:var(--nw,0px);text-align:right;font-style:normal;font:15px/1 var(--hand);color:var(--hair)}
.blist .rk{width:18px;text-align:center;font:13px/1 var(--hand);color:var(--faint)}
/* 分类条：一根条按比例分成几段，下面是图例 */
.cbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:4px 0 10px}
.cbar i{display:block;height:100%;background:var(--m);min-width:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--soft)}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--m)}
.legend b{font-weight:600;color:var(--ink)}
/* 时间线：左边一条竖线，每件事一颗点 */
.tl{list-style:none;margin:0;padding:0}
.tl > li{position:relative;padding:0 0 12px 20px}
.tl > li:last-child{padding-bottom:0}
.tl > li::before{content:"";position:absolute;left:5px;top:16px;bottom:-2px;width:1.5px;background:var(--rule)}
.tl > li:last-child::before{display:none}
.tl > li::after{content:"";position:absolute;left:0;top:5px;width:9px;height:9px;border-radius:50%;background:#fff;border:2.5px solid var(--m,var(--tip))}
.tl-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.tl-h b{font-weight:600}
.tl-h time,.tl-h .t{margin-left:auto;color:var(--faint);font-size:11.5px;white-space:nowrap}
.tl p{margin:3px 0 0;font-size:13.5px;line-height:1.55}
.tl small{display:block;color:var(--faint);font-size:11.5px;margin-top:2px;overflow-wrap:anywhere}  /* 长的模型名、路径放不下才断，不再把单词从中间切开 */
.tl .tl-box{margin-top:5px;padding:7px 10px;border-radius:var(--r-sm);background:var(--field)}
.tl > li.bad::after{border-color:var(--bad)}.tl > li.warn::after{border-color:var(--warn)}.tl > li.good::after{border-color:var(--good)}
/* 说明列表：左边是名目，右边是内容 */
.dl{display:grid;grid-template-columns:4.4em 1fr;margin:0;font-size:13px}
.dl dt{color:var(--faint);padding:7px 0;font-size:12px}
.dl dd{margin:0;padding:6px 0;min-width:0}
.dl dt:not(:first-of-type),.dl dt:not(:first-of-type) + dd{border-top:1px solid var(--line)}
/* 提示条 */
.callout{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:var(--r-md);background:var(--brand-soft);color:var(--soft);font-size:12.5px;line-height:1.5}
.callout .ic{width:16px;height:16px;margin-top:1px;color:var(--hair)}
.callout.warn{background:var(--warn-soft)}.callout.warn .ic{color:var(--warn)}
.callout.bad{background:var(--bad-soft)}.callout.bad .ic{color:var(--bad)}
.callout + *{margin-top:10px}
/* 进度条 */
.prog{height:8px;border-radius:4px;background:var(--field);overflow:hidden;margin:8px 0 6px;box-shadow:inset 0 0 0 1px var(--line)}
.prog i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--tip),var(--hair))}
/* 一天 24 小时的热闹程度：一格一小时 */
.heat{display:flex;align-items:flex-end;gap:3px;height:64px;margin:4px 0 4px}
.heat i{flex:1;border-radius:3px 3px 1px 1px;background:linear-gradient(var(--hair),var(--tip));min-height:3px;opacity:.85}
.heat i.pk{background:linear-gradient(var(--blush),#f6b6ca);opacity:1}
.heat-ax{display:grid;grid-template-columns:repeat(24,1fr);column-gap:3px;font-size:10.5px;color:var(--faint)}  /* 和上面的柱子同一套格子，刻度在柱子正下方 */
.heat-ax span{justify-self:center;white-space:nowrap}
/* 一排叠着的头像 */
.avs{display:inline-flex;align-items:center;padding-left:6px}
.avs img{width:24px;height:24px;border-radius:50%;margin-left:-6px;box-shadow:0 0 0 2px #fff;background:#fff}
.avs em{font-style:normal;font-size:11px;color:var(--faint);margin-left:4px}
.mrows{display:grid;gap:2px}
.mrow{display:flex;align-items:center;gap:8px;padding:6px 0;min-width:0}
.mrow + .mrow{border-top:1px solid var(--line)}
.mrow .tag{margin:0;min-width:4.6em}
.mrow-n{flex:1;min-width:0;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
/* 竖柱：每天的花费、一周几天 */
.vbars{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:4px}
.vb{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;gap:4px}
.vb-t{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end}
.vb-s{display:flex;flex-direction:column-reverse;flex:none;min-height:2px;border-radius:4px 4px 2px 2px;overflow:hidden;background:var(--field)}
.vb-s i{display:block;min-height:0}
.vb small{font-size:10px;color:var(--faint);text-align:center;white-space:nowrap;overflow:hidden}
/* 星期 × 小时的热力格 */
.hm{display:grid;grid-template-columns:2.4em repeat(24,1fr);gap:2px;align-items:center}
.hm i{display:block;aspect-ratio:1;border-radius:3px;background:color-mix(in srgb,var(--hair) calc(var(--a) * 100%),var(--field))}
.hm-l{font-size:10.5px;color:var(--faint)}
.hm small{font-size:9.5px;color:var(--faint);text-align:left}
/* 钱花在哪：一张小票，每一类一行，底下合计 */
.rcpt{list-style:none;margin:2px 0 0;padding:0}
.rcpt li{position:relative;display:flex;align-items:flex-start;gap:10px;padding:8px 0 11px}
.rcpt li + li{border-top:1px dashed var(--rule)}
.rcpt li::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--m);margin-top:6px}
.rc-n{flex:1;min-width:0}
.rc-n b{display:block;font:15px/1.35 var(--hand);font-weight:normal}
.rc-n small{display:block;font-size:11.5px;line-height:1.45;color:var(--faint)}
.rcpt em{flex:none;font-style:normal;font:16px/1.25 var(--hand);color:var(--ink);text-align:right;white-space:nowrap}
.rcpt em small{display:block;font:11px/1.3 var(--body);color:var(--faint)}
.rcpt li.free em{color:var(--faint)}
.rc-bar{position:absolute;left:19px;bottom:4px;height:3px;border-radius:2px;background:var(--m);opacity:.5;max-width:calc(100% - 19px)}
.rc-tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:2px;padding:9px 0 2px;border-top:3px double var(--ink);font:15px var(--hand)}
.rc-tot b{font:22px/1 var(--hand);font-weight:normal;color:var(--hair)}
.rc-note{margin:8px 0 0;line-height:1.5}
/* 每天的账：一天一行，点进去看那天的细账 */
.vb[data-day]{cursor:pointer}.vb[data-day]:hover .vb-s{filter:brightness(1.12);box-shadow:0 0 0 2px var(--brand-soft)}
.ldg{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ldg-r{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px 6px 4px;border:0;border-radius:var(--r-sm);background:none;text-align:left;cursor:pointer;color:inherit;font:inherit}
.ldg-r:hover{background:var(--field)}
.ldg-r.now{box-shadow:inset 3px 0 0 var(--hair)}
.ldg-d{flex:none;width:2.6em;text-align:center;line-height:1.05}
.ldg-d b{display:block;font:19px/1.1 var(--hand);font-weight:normal;color:var(--ink)}
.ldg-d small{font-size:10.5px;color:var(--faint)}
.ldg-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ldg-bar{display:flex;height:8px;min-width:4px;border-radius:4px;overflow:hidden;background:var(--field)}
.ldg-bar i{display:block;min-width:0}
.ldg-m small{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldg-t{display:flex;flex-wrap:wrap}.ldg-t .tag{font-size:11px;line-height:1.5;margin:0 4px 0 0}
.ldg-r em{flex:none;font-style:normal;font:16px/1 var(--hand);color:var(--hair);min-width:3.6em;text-align:right}
/* 余额的线 */
.balc{display:block;width:100%;height:auto;margin-top:10px;overflow:visible}
.balc .bc-g{stroke:var(--line);stroke-width:1}
.balc .bc-x{font-size:9px;fill:var(--faint);text-anchor:middle}
.balc .bc-alert{stroke:var(--bad);stroke-width:1;stroke-dasharray:3 3;opacity:.6}
.balc .bc-al{font-size:9px;fill:var(--bad);opacity:.8}
.balc .bc-area{fill:var(--hair);opacity:.08}
.balc .bc-line{fill:none;stroke:var(--hair);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.balc .bc-proj{stroke:var(--hair);stroke-width:1.5;stroke-dasharray:4 4;opacity:.55}
.balc .bc-top circle{fill:var(--good);stroke:var(--paper,#fff);stroke-width:1.5}
.balc .bc-top text{font-size:10px;fill:var(--good);text-anchor:middle;font-weight:600}
.balc .bc-now{fill:var(--hair);stroke:#fff;stroke-width:1.5}
.bc-cap{margin:4px 0 0;line-height:1.5}.bc-cap b{color:var(--ink);font-weight:600}
/* 投喂 */
.fed-sum{margin:0 0 10px;font-size:13.5px}.fed-tier{margin:-4px 0 10px}.fed-sum b{font:20px/1 var(--hand);font-weight:normal;color:#c98a12}
.tag.fed{color:#a86b00;background:#fbefd2}
.feedf{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.feedf input{min-width:0;font:inherit;font-size:13px;height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--rule);background:var(--field);color:var(--ink)}
.feedf input:focus{outline:none;border-color:var(--hair);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.feedf .ff-qq,.feedf .ff-note{grid-column:1/-1}
.feedf .btn{grid-column:1/-1;justify-self:end}
/* bot 标识：名字后面一个小机器人（〈卡〉、卡册、排行、名单），人泡泡右下角一颗 */
.botm{display:inline-grid;place-items:center;width:1.3em;height:1.3em;margin-left:.3em;border-radius:7px;background:#e6ecf8;color:#4f5f8c;vertical-align:-.12em;flex:none}
.botm .ic{width:.95em;height:.95em;stroke-width:2;vertical-align:0}
.ppl .bt{position:absolute;right:-3px;top:-3px;width:18px;height:18px;border-radius:50%;background:#fff;color:#4f5f8c;display:grid;place-items:center;box-shadow:0 1px 4px rgba(16,30,90,.25);pointer-events:none}
.ppl .bt .ic{width:12px;height:12px;stroke-width:2.2;vertical-align:0}
/* 知道是哪家做的 bot：画那家的标志，盖住小机器人（图没有就只剩小机器人） */
:is(.botm,.ppl .bt) img{width:100%;height:100%;border-radius:inherit;object-fit:cover;display:block}
:is(.botm,.ppl .bt) img~.ic{display:none}
.ppl .bt:has(img){width:20px;height:20px;overflow:hidden}
.bot-who{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 2px}
.bot-who select,.bot-who input{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--line,#d6deea);border-radius:8px;background:#fff;color:inherit;min-width:0}
.bot-who input{flex:1 1 120px}
.fd-del{margin-top:2px;padding:0;border:0;background:none;color:var(--faint);font-size:11.5px;cursor:pointer;text-decoration:underline dotted}
.mp-img{width:40px;height:40px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:6px;box-shadow:0 1px 3px rgba(40,50,80,.18)}
.fd-del:hover{color:var(--bad)}.fd-del[data-armed]{color:var(--bad);font-weight:600;text-decoration:none}
/* 表情包那页：筛选的小药丸、图墙、选中的那张 */
.mchips{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px}
.mchips.cats{margin-bottom:8px}
.mchip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);color:var(--soft);font-size:12px;cursor:pointer;white-space:nowrap}
.mchip em{font-style:normal;font-size:11px;color:var(--faint)}
.mchip:hover{color:var(--ink);border-color:var(--tip)}
.mchip[aria-pressed="true"]{background:var(--hair);border-color:var(--hair);color:#fff}
.mchip[aria-pressed="true"] em{color:rgba(255,255,255,.8)}
.mtool{display:flex;gap:6px;align-items:center;margin:0 0 10px}
.mtool input{flex:1;min-width:0;height:28px;padding:0 10px;font:inherit;font-size:12.5px;border-radius:8px;border:1px solid var(--rule);background:var(--field);color:var(--ink)}
.mtool input:focus{outline:none;border-color:var(--hair);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.mt{position:relative;aspect-ratio:1;padding:3px;border:0;border-radius:var(--r-sm);background:var(--field);cursor:pointer;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .15s,transform .15s}
.mt img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.mt:hover{box-shadow:inset 0 0 0 1.5px var(--tip);transform:translateY(-1px)}
.mt.on{background:var(--brand-soft);box-shadow:0 0 0 2.5px var(--hair)}
.mb{position:absolute;min-width:15px;padding:0 3px;border-radius:8px;font:10px/15px var(--body);font-style:normal;text-align:center;pointer-events:none}
.mb.mine{left:2px;top:2px;background:var(--blush);color:#fff}
.mb.bad{right:2px;top:2px;background:var(--bad);color:#fff}
.mb.n{right:2px;bottom:2px;background:rgba(28,43,102,.62);color:#fff}
.mgrid.mini{grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;margin:6px 0 4px}
.mgrid.mini img{display:block;width:100%;aspect-ratio:1;object-fit:contain;border-radius:6px;background:var(--field)}
.mg-one{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
.mg-big{flex:none;display:grid;place-items:center;width:44%;max-width:190px;aspect-ratio:1;overflow:hidden;border-radius:var(--r-md);background:var(--field);box-shadow:inset 0 0 0 1px var(--line)}
.mg-big img{max-width:100%;max-height:100%;object-fit:contain}
.mg-info{min-width:0}
.mg-info h3{margin:2px 0 6px;font:600 14px/1.3 var(--body);color:var(--hair);overflow-wrap:anywhere}
.mg-info p{margin:0;font-size:13px}
.mg-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.mg-acts select{flex:1;min-width:120px}
.mg-n{margin:0}.mg-n b{font:20px/1 var(--hand);font-weight:normal;color:var(--hair)}
.mg-more{display:flex;margin:10px auto 0}
/* 此刻：要主人管的事，一行一件，点了直接过去 */
.todo{display:grid;gap:6px}
.todo button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;border-radius:var(--r-md);background:var(--field);text-align:left;cursor:pointer;transition:background .2s}
.todo button:hover{background:var(--blush-soft)}
.todo .ic{color:var(--blush)}
.todo span{flex:1;min-width:0}.todo b{display:block;font-size:13.5px}
.todo small{display:block;color:var(--faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo em{font-style:normal;font-size:20px;color:var(--faint)}
/* 一列放不下时底下的「往下还有」 */
.more{position:fixed;bottom:calc(var(--bottom) - 2px);z-index:12;display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 12px;border-radius:999px;cursor:pointer;
  border:1px solid var(--glass-line);background:rgba(18,42,118,.32);color:#fff;font-size:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 14px -6px rgba(8,20,70,.5)}
.more .ic{width:14px;height:14px}
.more[data-side=left]{left:calc(var(--side) + var(--col) / 2 - 8px);transform:translateX(-50%)}
.more[data-side=right]{right:calc(var(--side) + var(--col) / 2 - 8px);transform:translateX(50%)}
.more:hover{background:rgba(18,42,118,.5)}
/* 投喂档位：一个圆章（饭钱的个人画像） */
.fstamp{flex:none;margin-left:auto;font-style:normal;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:68px;height:68px;border-radius:50%;background:#fbefd2;box-shadow:inset 0 0 0 2px color-mix(in srgb,#c98a12 40%,transparent);text-align:center;line-height:1}
.fstamp b{font:19px/1 var(--hand);font-weight:normal;color:#c98a12}.fstamp small{font-size:10px;color:#a86b00;white-space:nowrap}
/* 加载中的灰条 */
.sk{height:12px;border-radius:6px;margin:8px 0;background:linear-gradient(90deg,var(--field) 0,#e7eef9 40%,var(--field) 80%) 0 0/200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- 心里的人：围着她转的一圈圈人 ---------- */
#field{position:fixed;inset:0;z-index:8;pointer-events:none}
#field.on{pointer-events:auto}
#field svg.ties{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#field .orbit{fill:none;stroke-width:1;stroke-dasharray:2 6;opacity:0;transition:opacity .8s}  /* 人绕的轨道：只有极客模式画出来 */
.ppl{position:absolute;left:0;top:0;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);border-radius:50%;border:0;padding:0;cursor:pointer;
  background:var(--c);box-shadow:0 0 0 2.5px var(--c),0 0 18px color-mix(in srgb,var(--c) 70%,transparent),0 4px 10px rgba(8,20,70,.3);
  transition:opacity .4s,filter .4s,box-shadow .3s;will-change:transform}
.ppl img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.ppl.att{filter:grayscale(.75) brightness(.85);--c:#9aa6c2}
.ppl.att::after{content:attr(data-att);position:absolute;right:-12px;bottom:-6px;padding:0 5px;border:1.5px solid #e9724f;border-radius:4px;background:#fff;color:#e9724f;font:11px/1.4 var(--hand);transform:rotate(-8deg)}
.ppl.owner{--c:#e0a630}
.ppl .nm{position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink);
  font-size:12px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.ppl.sel .nm{opacity:1}
.ring-layer{position:fixed;inset:0;pointer-events:none}
.ring-layer .ppl{pointer-events:auto}
.ring-layer.picked .ppl:not(.sel){opacity:.28;filter:grayscale(.6) blur(.5px)}
.ppl.sel{box-shadow:0 0 0 3px #fff,0 0 0 7px var(--c),0 0 36px var(--c)}
/* ---------- 记忆深处：〈我〉自己的记忆（记忆线的纸） ---------- */
.ml-foot{margin:0;padding:8px 18px 14px}
.ml-btns{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px}
.ml-btns small{font-size:11.5px}
.ml-qq input{flex:1;min-width:0;font:inherit;font-size:12.5px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--rule);background:var(--field);color:var(--ink)}
.ml-more{margin-top:6px;padding:8px 10px;border-radius:var(--r-sm);background:var(--field);font-size:12.5px;line-height:1.55}
.ml-more h4{margin:6px 0 4px;font-size:12px;color:var(--soft)}
.ml-more h4:first-child{margin-top:0}
.ml-more ol{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.ml-src li small,.ml-hist li small{display:block;color:var(--faint);font-size:11px}
.ml-src li b{margin-right:4px;color:var(--soft)}
.ml-src li.mine b{color:var(--hair)}
.ml-hist li{padding-left:8px;box-shadow:inset 2px 0 0 var(--rule)}
.ml-hist li.me{box-shadow:inset 2px 0 0 var(--hair)}
.ml-hist li p{margin:1px 0 0}
.ml-more i{font-style:normal;color:var(--hair)}
.ml-edit textarea{width:100%;box-sizing:border-box;font:inherit;font-size:13px;padding:6px 10px;border-radius:9px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);resize:vertical}
.ml-edges{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:12.5px}
.ml-edges li{display:flex;align-items:baseline;gap:8px}
.ml-edges li span{flex:1;min-width:0;color:var(--soft)}
.ml-edges li i{font-style:normal;color:var(--hair);font-weight:600}
.ml-edges li small{color:var(--faint);font-size:11px;white-space:nowrap}
.lnk{border:0;padding:0;background:none;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline dotted var(--faint);text-underline-offset:3px;white-space:nowrap}
/* 时间线（简易版）：一句一行，时间在左；还没抽成记忆的浅一点 */
.tlrows{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.tlr{display:grid;grid-template-columns:42px 1fr;gap:8px;padding:4px 6px;border-radius:var(--r-sm);font-size:12.5px;line-height:1.55}
.tlr:hover{background:var(--field)}
.tlr time{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums;padding-top:1px}
.tlr p{margin:0;min-width:0;overflow-wrap:anywhere;color:var(--soft)}
.tlr p small{display:block;color:var(--faint);font-size:11px}
.tlr b{display:inline;margin-right:5px;color:var(--ink);font-weight:600}
.tlr.k-said b,.tlr.k-tool b,.tlr.k-did b,.tlr.k-thought b{color:var(--hair)}
.tlr.k-said p{color:var(--ink)}
.tlr.todo{opacity:.62}
.tl-nav{justify-content:center;margin-top:10px}
.flegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--soft)}
.flegend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px;box-shadow:0 0 6px var(--c)}


/* 一个人：天平 + 心的形状 + 回忆碎片 */
.lock{color:var(--blush);font-weight:600}
.lock .ic{width:13px;height:13px;vertical-align:-2px}
.imp{font-size:11px;padding:0 6px;border-radius:999px;background:color-mix(in srgb,var(--tip) 25%,transparent);margin-left:4px;white-space:nowrap}
.imp.neg{background:color-mix(in srgb,var(--blush) 22%,transparent)}
.att-stamp{display:inline-block;padding:1px 9px;border:2px solid #e9724f;border-radius:6px;color:#e9724f;font:14px/1.3 var(--hand);transform:rotate(-6deg);margin-left:auto}
svg.scale{width:100%;height:auto;display:block;margin:0;overflow:visible}
.scale-cap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.scale-cap > span{padding:8px 12px;border-radius:var(--r-md);background:var(--brand-soft);font-size:12px;color:var(--soft)}
.scale-cap > span.neg{background:var(--blush-soft)}
.scale-cap b{display:block;font:22px/1.2 var(--hand);font-weight:normal;color:var(--hair)}
.scale-cap .neg b{color:var(--bad)}
svg.radar{width:100%;height:auto;display:block;overflow:visible}
.rd-grid{fill:none;stroke:var(--rule);stroke-dasharray:3 4}
.rd-grid:last-of-type{stroke:#c3d4ea;stroke-dasharray:none}
.rd-axis{stroke:var(--rule)}
.rd-shape{fill:color-mix(in srgb,var(--c) 26%,transparent);stroke:var(--c);stroke-width:2;stroke-linejoin:round}
.rd-dot{stroke:#fff;stroke-width:2;cursor:help}
.rd-ghost{fill:none;stroke:#d8506f;stroke-width:1.6;stroke-dasharray:4 3;opacity:.75}.rd-l tspan.rd-all{fill:#d8506f;font-size:11px;opacity:.75}.scale-cap small{font-size:10.5px;margin-left:2px;opacity:.8}
.rd-l{font:14px var(--hand);fill:var(--ink)}.rd-l tspan{fill:var(--hair)}
.rd-l.bad,.rd-l.bad tspan{fill:var(--bad)}
.geng small{color:var(--faint);margin-left:4px}
.privbox{margin:10px 0 0;padding:8px 10px;border-radius:var(--r-sm);background:var(--blush-soft);font-size:12.5px}
/* 还剩多少分量：一根很短的条 */
.age{display:inline-block;width:34px;height:4px;border-radius:2px;background:var(--rule);overflow:hidden;vertical-align:middle}
.age i{display:block;height:100%;background:var(--tip)}
.tl .fade{opacity:calc(.45 + .55 * var(--fresh,1))}

/* 记忆一层层往下沉 */
.layers{display:grid;gap:6px}
.layer{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-md);color:#fff;font-size:12.5px;background:var(--lc)}
.layer b{font:16px/1 var(--hand);font-weight:normal}
.layer small{margin-left:auto;opacity:.85}
.layer em{font-style:normal;font:17px/1 var(--hand);min-width:3.4em;text-align:right}.layer em i{font:11px var(--body);font-style:normal;opacity:.8;margin-left:2px}

/* 人物抬头（来信、说说） */
.who{display:flex;gap:10px;align-items:center;min-width:0}
.who img{width:36px;height:36px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--rule)}
.who > span{min-width:0;flex:1}
.who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:var(--faint);font-size:12px}
/* 来信：一封封竖着排 */
.letter{padding:12px 0}
.letter + .letter{border-top:1px solid var(--line)}
.letter q{display:block;margin:8px 0 4px;padding:6px 10px;border-radius:var(--r-sm);background:var(--field);font-size:13px;quotes:none}
.letter q.none{color:var(--faint)}
.letter .prop-k{margin:8px 0 0;font-size:12px;color:var(--muted)}
.letter .prop-k + q.prop-note{margin-top:4px}
.stamp{flex:none;font:13px/1 var(--hand);font-style:normal;padding:5px 7px 3px;border:1.5px solid currentColor;border-radius:5px;transform:rotate(-6deg);color:var(--soft);opacity:.85;white-space:nowrap}
.stamp.ok{color:var(--good)}.stamp.no{color:var(--bad)}.stamp.wait{color:var(--warn)}
.tl-h .stamp{margin-left:auto}
/* 说说草稿：横线纸 */
#qzText{width:100%;resize:vertical;font:inherit;font-size:14px;line-height:28px;color:var(--ink);padding:4px 12px;border:1px solid var(--rule);border-radius:var(--r-md);margin-top:10px;
  background:repeating-linear-gradient(transparent 0 27px,var(--rule) 27px 28px) local,#fffdf8;background-position:0 4px}
#qzText:focus{outline:none;border-color:var(--hair);box-shadow:0 0 0 3px var(--brand-soft)}
.qz-n{display:block;text-align:right;color:var(--faint);font-size:12px}
.qz-full{white-space:pre-line}
.qz-pic{display:block;width:fit-content;max-width:100%;margin-top:7px}
.qz-pic img{display:block;max-width:100%;max-height:240px;border-radius:9px;box-shadow:0 1px 4px rgba(12,26,74,.18)}
.inline{display:flex;gap:6px;margin-top:10px}
.inline input{flex:1;min-width:0;font:inherit;font-size:13px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--rule);background:var(--field);color:var(--ink)}
.inline input:focus{outline:none;border-color:var(--hair);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.report-text{margin-top:10px;padding:10px 12px;background:var(--field);border-radius:var(--r-md);white-space:pre-wrap;font-size:13px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 自主：她想做的事，带 ✓ ✗ 点评 */
.mact{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:5px}
.mact .chip{margin:0;cursor:help}
.pcdays{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 8px}.pcdays .chip{cursor:pointer;border:0;font:inherit}.pcdays .chip.on{color:#fff;background:var(--blush)}
.pcstep{margin:2px 0}.pcstep summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}.pcstep summary::-webkit-details-marker{display:none}
.pcstep pre{margin:2px 0 6px;padding:6px 8px;max-height:220px;overflow:auto;font-size:11px;line-height:1.45;background:var(--field);border-radius:6px;white-space:pre-wrap;word-break:break-word}.pcstep img{max-width:100%;border-radius:6px;margin:4px 0}
.rv{display:inline-flex;gap:2px}
.rvb{width:24px;height:22px;padding:0;border-radius:6px;border:1px solid var(--rule);background:#fff;color:var(--faint);font-size:12px;line-height:1;cursor:pointer}
.rvb:hover{color:var(--good);border-color:var(--good)}.rvb.bad:hover{color:var(--bad);border-color:var(--bad)}
.rvb[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.rvb.bad[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
.rv-note{flex:1 1 100%;min-width:0;font:inherit;font-size:12px;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--rule);background:var(--field);color:var(--ink)}

/* ---------- 动效用的小东西 ---------- */
/* 从她头上飘出去的泡泡 */
.ghost{position:fixed;left:0;top:0;z-index:11;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 32% 28%,#fff 0 7%,rgba(255,255,255,.35) 16%,rgba(255,255,255,.08) 55%,rgba(255,255,255,.3) 100%);
  border:1.5px solid rgba(255,255,255,.75);box-shadow:inset 0 -5px 12px rgba(255,255,255,.2),0 0 22px rgba(255,255,255,.35)}
.flyer{position:fixed;left:0;top:0;z-index:30;border-radius:50%;object-fit:cover;pointer-events:none;box-shadow:0 0 0 3px #fff,0 10px 30px rgba(8,20,70,.35)}
/* 底部脑区背后那团光 */
#dock .halo{position:absolute;left:0;top:0;width:96px;height:96px;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(255,255,255,.12) 55%,transparent)}
/* 思考泡泡里一个个冒出来的字 */
#thought .tt{display:inline}
#thought .tt span{display:inline-block}
/* 悬停的小纸条 */
#tip{position:fixed;left:0;top:0;z-index:40;max-width:280px;padding:9px 12px;border-radius:12px;background:#fffdf8;color:var(--ink);font-size:13px;line-height:1.55;
  box-shadow:var(--sh-pop),0 0 0 1px rgba(16,30,90,.06);pointer-events:none;visibility:hidden}
#tip .tip-a{position:absolute;width:12px;height:12px;background:#fffdf8;transform:rotate(45deg);border-radius:2px}
#tip .tip-b{position:relative;z-index:1}
#tip b{font-weight:700}#tip small{color:var(--faint);font-size:11.5px}
#tip .tag{margin-right:2px}
.tp-who{display:flex;align-items:center;gap:8px;margin-bottom:4px}.tp-who b{font:17px/1.2 var(--hand);font-weight:normal}
.tp-bars{display:grid;grid-template-columns:2.4em 1fr 1.8em;gap:3px 8px;align-items:center;font-size:12px;margin:2px 0 4px}
.tp-bars i{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--c) var(--w),var(--field) var(--w))}
.tp-bars em{font:13px/1 var(--hand);font-style:normal;text-align:right}
.tp-q{margin:4px 0;padding:4px 8px;border-radius:6px;background:var(--field);font-size:12.5px}
.att-stamp.sm{font-size:12px;padding:0 6px;border-width:1.5px;margin-left:0}
[data-tip]{cursor:help}
.ppl[data-tip],.mcard[data-tip]{cursor:pointer}

/* ---------- 〈卡〉：外框颜色按好感分档（主人金箔、喜欢海蓝、亲近浅蓝、普通银蓝、讨厌粉）---------- */
.fc-wrap{flex:none;position:relative}
.fcard{--t1:#9aa6c2;--t2:#dfe7f5;--t3:#5a6a96;position:relative;display:grid;border-radius:18px;cursor:pointer;transform-style:preserve-3d;
  font-family:var(--hand);color:#1c2b66}
.fcard.t-owner{--t1:#c9921f;--t2:#f7e2a4;--t3:#8a5c00}.fcard.t-love{--t1:#2f5fd0;--t2:#a9d8f5;--t3:#1c2b66}
.fcard.t-close{--t1:#5fa8e6;--t2:#d6eefc;--t3:#2346a8}.fcard.t-hate{--t1:#d8506f;--t2:#f8c9d6;--t3:#9c2846}
.fc-face{grid-area:1/1;position:relative;border-radius:18px;padding:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:linear-gradient(145deg,var(--t1),var(--t2) 38%,var(--t1) 62%,var(--t2));box-shadow:0 16px 30px rgba(8,20,70,.3)}
/* 卡上别用 filter，会把 3D 压扁、翻面时背面出不来 */
.fc-face > *:not(.holo){position:relative;background:#fbfcff}
/* 背面贴在正面后头，高度跟正面一样，内容多了就在里面滚 */
.fc-back{position:absolute;inset:0;transform:rotateY(180deg);display:flex;flex-direction:column}
.fc-top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 7px;border-radius:12px 12px 0 0;font:12px var(--body);color:#5a6a96}
.fc-tier{font:13px/1 var(--hand);color:var(--t3);display:flex;align-items:center;gap:5px}
.fc-tier::before{content:"";width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--t1),var(--t2));box-shadow:0 0 0 1.5px var(--t1)}
.fc-back .fc-tier::before{display:none}.fc-back .fc-tier .ic{width:15px;height:15px;color:var(--blush)}
.fc-art{position:relative;height:178px;padding:0 9px;overflow:hidden}
.fc-art img{width:100%;height:100%;object-fit:cover;display:block;border-radius:9px}
.fc-art::after{content:"";position:absolute;left:9px;right:9px;bottom:-1px;height:10px;background:radial-gradient(circle at 7px 10px,#fbfcff 6.5px,transparent 7px) 0 0/14px 10px repeat-x}
.fc-tags{position:absolute;left:18px;top:9px;z-index:2;display:flex;align-items:center;gap:6px}
.fc-att-st{margin:0;background:rgba(251,252,255,.94);font-size:15px}
.fc-mood{display:inline-flex;align-items:center;gap:5px;padding:2px 10px 2px 7px;border-radius:999px;background:rgba(251,252,255,.94);font:600 12px var(--body)}
.fc-mood::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--m)}
.fc-fav{position:absolute;right:18px;top:9px;z-index:2;min-width:50px;padding:4px 10px 3px;border-radius:999px;background:var(--t3);color:#fff;text-align:center;font:17px/1.1 var(--hand)}
.fc-fav::before{content:"♡ ";font:600 12px var(--body)}
.fc-body{padding:4px 16px 14px;border-radius:0 0 12px 12px}
.fc-name{font-size:24px;line-height:1.25;font-weight:normal;margin:2px 0 5px;word-break:break-all}
.fc-stage{display:inline-block;padding:2px 12px 2px 9px;font-size:12.5px;color:#fff;background:var(--t3);clip-path:polygon(0 0,100% 0,calc(100% - 7px) 50%,100% 100%,0 100%)}
.fc-meter{margin:12px 0 3px;height:7px;border-radius:4px;background:linear-gradient(90deg,#f3c4d1,#eef2fa 50%,#cfe6fb);position:relative}
.fc-meter i{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:#fff;border:3px solid var(--t3)}
.fc-meter-l{display:flex;justify-content:space-between;font:11px var(--body);color:#8a97b8}
.fc-stats{display:grid;grid-template-columns:repeat(3,1fr);margin:10px 0 0;border-top:1px dashed #d3e3f4;border-bottom:1px dashed #d3e3f4}
.fc-stats div{padding:6px 0;text-align:center}.fc-stats div + div{border-left:1px dashed #d3e3f4}
.fc-stats b{display:block;font-size:20px;line-height:1.2;font-weight:normal;color:#2f5fd0}.fc-stats small{color:#5a6a96;font:11.5px var(--body)}
.fc-stats div{cursor:help}.fc-stats b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fc-stats b i{font-style:normal;font-size:12px;margin-left:2px;opacity:.75}
.fc-meter .tk{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:1px;background:rgba(47,95,208,.45)}
.fcard.fed .fc-meter .tk{background:var(--acc);opacity:.6}
.fc-unsent{margin:10px 0 0;display:flex;gap:5px;align-items:flex-start}.fc-unsent svg{flex:none;width:13px;height:13px;margin-top:2px}
.feel-line{padding-bottom:0}.feel-line p{margin:0;padding:8px 11px;border-radius:8px;background:#fdf0f4;font-size:15px;line-height:1.55}
.feel-line small{display:block;margin-top:4px;color:#8a97b8;font:11.5px var(--body)}
.fc-feel{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.fc-feel span{padding:1px 9px;border-radius:999px;font-size:13px;color:#fff;background:var(--c)}
.fc-quote{margin:10px 0 0;padding:8px 11px;border-radius:8px;background:#eef5fc}
.fc-quote small{display:block;color:#8a97b8;font:11.5px var(--body)}
.fc-quote p{margin:2px 0 0;font-size:16px;line-height:1.5}
.fc-quote p::before{content:"「";color:var(--t1)}.fc-quote p::after{content:"」";color:var(--t1)}
.fc-foot{display:flex;align-items:center;gap:7px;margin-top:11px;font:11.5px var(--body);color:#8a97b8}
.fc-foot img{width:24px;height:24px;border-radius:50%;border:2px solid var(--t1)}.fc-foot span:last-child{margin-left:auto}
.fc-back-in{flex:1;min-height:0;overflow-y:auto;padding:4px 14px 14px;border-radius:0 0 12px 12px;font-family:var(--body);scrollbar-width:thin}
.fc-att{display:flex;gap:10px;align-items:flex-start;margin:6px 0 4px;font-size:12.5px;color:var(--soft)}.fc-att .att-stamp{margin:0;flex:none}
.fc-h{font:15px/1.2 var(--hand);font-weight:normal;margin:12px 0 4px}
.fc-hist{list-style:none;margin:0;padding:0 0 0 12px;border-left:2px solid var(--rule)}
.fc-hist li{position:relative;padding:3px 0 5px}.fc-hist li::before{content:"";position:absolute;left:-17px;top:9px;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid var(--t1)}
.fc-hist p{margin:0;font-size:13px}.fc-hist small{color:var(--faint);font-size:11px}
.fc-hint{margin:8px 0 0;text-align:center;font:12px var(--body);color:rgba(255,255,255,.8);text-shadow:0 1px 6px rgba(8,20,70,.4)}
/* 镭射箔：彩虹斜纹 + 细闪点，跟着鼠标流动 */
.holo{position:absolute;inset:0;pointer-events:none;border-radius:inherit;z-index:3;mix-blend-mode:color-dodge;opacity:var(--holo-o,.18);transition:opacity .3s;
  background:radial-gradient(circle at var(--mx,50%) var(--my,40%),rgba(255,255,255,.5),transparent 42%),
    repeating-linear-gradient(115deg,#ff7eb3 0%,#ffd36e 6%,#8dffc8 12%,#6ec8ff 18%,#b58cff 24%,#ff7eb3 30%),
    radial-gradient(circle,rgba(255,255,255,.95) 0 .8px,transparent 1.3px) 0 0/11px 11px;
  background-size:100% 100%,320% 320%,11px 11px;background-position:center,var(--hx,40%) var(--hy,40%),0 0}
.holo::after{content:"";position:absolute;inset:0;border-radius:inherit;mix-blend-mode:overlay;opacity:.5;background:linear-gradient(var(--ha,125deg),transparent 30%,rgba(255,255,255,.65) 48%,transparent 62%)}
.holo.frame{padding:8px;mix-blend-mode:hard-light;opacity:var(--frame-o,.4);-webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.fc-art .holo{left:9px;right:9px;border-radius:9px;z-index:1}
.fcard.lit .holo{--holo-o:.42}.fcard.lit .holo.frame{--frame-o:.75}

/* ---------- 投喂过的〈卡〉：整张换成这一档的背景画（bond 带的 card_assets/feed），下半雾面玻璃；跟 QQ 里发的那张一样，五档分高低靠画和材质 ---------- */
.fcard.fed,.mcard.fed{--serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif}
.fcard.fed{--gt:232px;--ink:#1c2b66;--soft:#5a6a96;--rl:rgba(28,43,102,.15);--glass:rgba(250,251,252,.6);--gline:rgba(255,255,255,.72);--fl:rgba(255,255,255,.62);--acc:#8fa6c9}
.fcard.fed.f1,.mcard.fed.f1{--deep:#fce5ce;--t1:#d8c6a0;--t2:#fffaf0;--t3:#8a7445;--r1:#fffdf7;--r2:#e9dcc0;--r3:#fffaf0;--r4:#d8c6a0;--acc:#a8884c}
.fcard.fed.f2,.mcard.fed.f2{--deep:#3d4f74;--t1:#8b96aa;--t2:#eef2f7;--t3:#3b4a6b;--r1:#f7f9fc;--r2:#a9b3c4;--r3:#eef2f7;--r4:#8b96aa;--acc:#d5dbe6;--fl:rgba(220,228,240,.6)}
.fcard.fed.f3,.mcard.fed.f3{--deep:#61acd2;--t1:#b9c6dc;--t2:#fbf6ff;--t3:#5a6f96;--r1:#fbf6ff;--r2:#d7e9f6;--r3:#f8e7f0;--r4:#c9cfdc;--acc:#7f97bd}
.fcard.fed.f4,.mcard.fed.f4{--deep:#b49389;--t1:#c49a50;--t2:#fbefd2;--t3:#7a5a22;--r1:#fbefd2;--r2:#c49a50;--r3:#fff5dc;--r4:#a37a35;--acc:#a8803a;--fl:rgba(226,194,128,.9)}
.fcard.fed.f5,.mcard.fed.f5{--deep:#424d7f;--t1:#b0853b;--t2:#fff1cf;--t3:#8a6526;--r1:#fff1cf;--r2:#d2a85a;--r3:#fff8e6;--r4:#b0853b;--acc:#e6c27a;--fl:rgba(226,194,128,.9)}
/* 专属背景（own）：香槟金，画露得多一点；画的下半截偏暗时配深色玻璃（dk） */
.fcard.fed.own,.mcard.fed.own{--deep:#d9cfc6;--t1:#c49a50;--t2:#fbefd2;--t3:#7a5a22;--r1:#fbefd2;--r2:#c49a50;--r3:#fff5dc;--r4:#a37a35;--acc:#a8803a;--fl:rgba(226,194,128,.9)}
.fcard.fed.own{--gt:280px}
.fcard.fed.own.dk,.mcard.fed.own.dk{--acc:#e6c27a}
/* 深色玻璃：月下海面、深海星河、偏暗的专属背景 */
.fcard.fed:is(.f2,.f5,.dk){--ink:#f2f4f9;--soft:rgba(226,232,244,.74);--rl:rgba(255,255,255,.16);--glass:rgba(14,20,42,.5);--gline:rgba(255,255,255,.16)}
/* 窄屏时卡会撑满整栏，画会被放大只剩一角：投喂卡最宽 460，居中 */
.fcard.fed{max-width:460px;margin:0 auto}
.fcard.fed .holo,.mcard.fed .holo{display:none}
/* 画按卡宽铺（跟 QQ 里那张一样露出上半）；卡比画高时，底下接这张画底部的颜色（--deep），反正在玻璃底下 */
.fcard.fed .fc-front{padding:0;overflow:hidden;background:var(--deep)}
.fcard.fed .fc-front > *:not(.holo){background:none}
.fcard.fed .fc-front > .fc-scene,.fcard.fed .fc-front > .fc-frost{position:absolute;inset:0;background:var(--art) center top/100% auto no-repeat;pointer-events:none}
.fcard.fed .fc-front > .fc-frost{background-image:var(--artb);clip-path:inset(var(--gt) 10px 10px 10px round 14px)}
.fcard.fed .fc-front::after{content:"";position:absolute;inset:6px;border-radius:13px;border:1px solid var(--fl);pointer-events:none;z-index:4}
.fcard.fed .fc-art{height:var(--gt);padding:0}
.fcard.fed .fc-art::after{display:none}
.fcard.fed .fc-tags{left:16px;top:16px}
.fcard.fed .fc-fav{right:16px;top:16px;background:var(--glass);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gline)}
.fcard.fed .fc-front > .fc-body{margin:0 10px 10px;padding:14px 16px 12px;border-radius:14px;background:var(--glass);color:var(--ink);
  box-shadow:inset 0 0 0 1px var(--gline),inset 0 1px 0 rgba(255,255,255,.45)}
.fc-id{display:flex;align-items:center;gap:12px}
.fc-ring{flex:none;width:58px;height:58px;padding:3px;border-radius:50%;background:conic-gradient(from 210deg,var(--r1),var(--r2),var(--r3),var(--r4),var(--r1));box-shadow:0 3px 10px rgba(8,20,70,.22)}
.fc-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.fc-idt{flex:1;min-width:0}
.fcard.fed .fc-name{margin:0;font:600 22px/1.25 var(--serif);letter-spacing:.02em}
.fc-sub{margin:3px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:0 5px;font:12px var(--body);color:var(--soft)}.fc-sub > span{white-space:nowrap}
.fcard.fed .fc-sub .fc-mood{padding:0;background:none;font:inherit;color:inherit}
.fc-rank{flex:none;align-self:flex-start;display:flex;flex-direction:column;align-items:flex-end;color:var(--acc);line-height:1}
.fc-rank b{font:500 26px/1 var(--serif)}.fc-rank small{margin-top:5px;font:12px var(--body);color:var(--soft);letter-spacing:.08em}
.fcard.fed .fc-meter{background:linear-gradient(90deg,rgba(216,80,111,.3),rgba(255,255,255,.5) 50%,rgba(47,95,208,.3))}
.fcard.fed .fc-meter i{border-color:var(--acc)}
.fcard.fed .fc-meter-l,.fcard.fed .fc-stats small,.fcard.fed .fc-quote small,.fcard.fed .fc-foot{color:var(--soft)}
.fcard.fed .fc-stats,.fcard.fed .fc-stats div + div{border-color:var(--rl)}
.fcard.fed .fc-stats b{color:var(--ink);font-family:var(--serif)}
.fcard.fed .fc-quote{background:rgba(255,255,255,.34)}
.fcard.fed .fc-quote p::before,.fcard.fed .fc-quote p::after{color:var(--acc)}
.fcard.fed .fc-foot span:first-child{flex:1;min-width:0}
.fcard.fed:is(.f2,.f5,.dk) .fc-quote{background:rgba(255,255,255,.07)}
.fcard.fed:is(.f2,.f5,.dk) .fc-meter{background:linear-gradient(90deg,rgba(216,80,111,.45),rgba(255,255,255,.18) 50%,rgba(110,160,240,.45))}
.fcard.fed:is(.f2,.f5,.dk) .fc-meter i{background:#1a2240}
/* 金字名字（四、五档、专属背景） */
.fcard.fed:is(.f4,.own) .fc-name{background:linear-gradient(100deg,#7a5a22,#b08a45 45%,#6e501c);-webkit-background-clip:text;background-clip:text;color:transparent}
.fcard.fed:is(.f5,.own.dk) .fc-name{background:linear-gradient(100deg,#fff4d6,#e6c27a 45%,#fbe6b3);-webkit-background-clip:text;background-clip:text;color:transparent}
/* 四、五档：一道柔光慢慢扫过；五档背景里还有几点光往上飘 */
.fcard.fed .fc-front > .fc-sheen{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5;border-radius:inherit}
.fc-sheen::before{content:"";position:absolute;top:-20%;bottom:-20%;left:-50%;width:38%;background:linear-gradient(100deg,transparent,rgba(255,242,206,.32) 50%,transparent);
  transform:translateX(0) skewX(-8deg);animation:fc-sweep 7s cubic-bezier(.45,0,.2,1) infinite}
@keyframes fc-sweep{0%{transform:translateX(0) skewX(-8deg)}24%,100%{transform:translateX(440%) skewX(-8deg)}}
.fcard.fed .fc-front > .fc-motes{position:absolute;left:0;right:0;top:0;height:var(--gt);pointer-events:none;z-index:1}
.fc-motes i{position:absolute;bottom:6%;width:3px;height:3px;border-radius:50%;background:#ffeec4;box-shadow:0 0 6px 2px rgba(255,214,140,.5);opacity:0;animation:fc-mote 9s linear infinite}
.fc-motes i:nth-child(1){left:14%}.fc-motes i:nth-child(2){left:27%;animation-delay:-2.1s}.fc-motes i:nth-child(3){left:41%;animation-delay:-4.7s}
.fc-motes i:nth-child(4){left:55%;animation-delay:-1.3s}.fc-motes i:nth-child(5){left:66%;animation-delay:-6.2s}.fc-motes i:nth-child(6){left:78%;animation-delay:-3.4s}
.fc-motes i:nth-child(7){left:88%;animation-delay:-7.6s}.fc-motes i:nth-child(8){left:34%;animation-delay:-5.5s;width:2px;height:2px}
@keyframes fc-mote{0%{transform:translateY(0);opacity:0}15%{opacity:.85}100%{transform:translateY(-160px);opacity:0}}
@media (prefers-reduced-motion:reduce){.fc-sheen::before,.fc-motes i{animation:none}.fc-motes{display:none}}

/* 小卡（手里的扇形、卡册） */
.mcard{--t1:#9aa6c2;--t2:#dfe7f5;--t3:#5a6a96;position:relative;width:132px;border-radius:12px;padding:5px;cursor:pointer;text-align:left;border:0;color:#1c2b66;font-family:var(--hand);
  background:linear-gradient(145deg,var(--t1),var(--t2) 40%,var(--t1) 65%,var(--t2));box-shadow:0 6px 16px rgba(8,20,70,.22)}
.mcard.t-owner{--t1:#c9921f;--t2:#f7e2a4;--t3:#8a5c00}.mcard.t-love{--t1:#2f5fd0;--t2:#a9d8f5;--t3:#1c2b66}
.mcard.t-close{--t1:#5fa8e6;--t2:#d6eefc;--t3:#2346a8}.mcard.t-hate{--t1:#d8506f;--t2:#f8c9d6;--t3:#9c2846}
.mcard .holo{--holo-o:.14}.mcard:hover .holo{--holo-o:.4}.mcard:hover .holo.frame{--frame-o:.75}.mcard .holo.frame{padding:5px}
.mc-in{display:flex;flex-direction:column;border-radius:8px;background:#fbfcff;overflow:hidden;height:100%}
.mc-art{position:relative;aspect-ratio:1/.8;background:linear-gradient(#bfe6fa,#5fa8e6);overflow:hidden}
.mc-art img{width:100%;height:100%;object-fit:cover;display:block}
.mc-art .holo{border-radius:0;z-index:1}
.mc-art::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:7px;background:radial-gradient(circle at 4.5px 7px,#fbfcff 4.3px,transparent 4.7px) 0 0/9px 7px repeat-x}
.mc-fav{position:absolute;right:5px;top:5px;z-index:2;padding:1px 7px;border-radius:999px;background:var(--t3);color:#fff;font-size:13px;line-height:1.3}
.mc-fav::before{content:"♡ ";font-size:10px}
.mc-body{display:flex;flex-direction:column;gap:3px;padding:5px 8px 8px;min-width:0}
.mc-name{font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-stage{align-self:flex-start;max-width:100%;padding:0 9px 0 6px;font-size:11px;color:#fff;background:var(--t3);clip-path:polygon(0 0,100% 0,calc(100% - 5px) 50%,100% 100%,0 100%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-impr{font:12px/1.45 var(--body);color:#3c4a7a;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
/* 投喂过的、有专属背景的小卡：上面是那张画，头像缩成一个小圆，左上角是档位 */
.mcard.fed .mc-art{background:var(--art) center 22%/cover no-repeat}
.mcard.fed .mc-art img{position:absolute;left:7px;bottom:10px;width:38%;height:auto;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 2px var(--r2),0 2px 6px rgba(8,20,70,.3)}
.mc-rank{position:absolute;left:6px;top:5px;z-index:2;padding:0 7px;border-radius:999px;background:rgba(255,255,255,.8);color:var(--t3);font:600 12px/1.5 var(--serif)}
.mcard.fed:is(.f2,.f5,.dk) .mc-rank{background:rgba(14,20,42,.62);color:#f2e3bd}
/* 手里捏着的一扇卡：不放在纸上，直接浮在水里 */
.deck{flex:none;position:relative;color:#fff;padding-top:4px}
.deck-h{margin:0 6px;font:21px/1.2 var(--hand);font-weight:normal;text-shadow:0 2px 10px rgba(8,20,70,.4)}
.deck-h small{margin-left:8px;font:12px var(--body);opacity:.85}
.hand{position:relative;height:258px}
.hand .mcard{position:absolute;left:50%;top:42px;width:112px;box-shadow:0 10px 24px rgba(8,20,70,.3)}
.thinkof{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.thinkof button{display:grid;grid-template-columns:34px 1fr;column-gap:10px;align-items:start;width:100%;padding:8px 6px;border:0;border-radius:10px;background:none;text-align:left;color:inherit;font:inherit;cursor:pointer}
.thinkof button:hover{background:color-mix(in srgb,var(--m) 12%,transparent)}
.thinkof img{grid-row:span 2;width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 2px color-mix(in srgb,var(--m) 70%,#fff)}
.to-h{display:flex;align-items:baseline;gap:6px;min-width:0}.to-h b{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.to-h i{font-style:normal;font-size:11px;padding:0 6px;border-radius:999px;color:var(--m);background:color-mix(in srgb,var(--m) 14%,transparent);white-space:nowrap}
.to-h time{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
.to-t{font-size:12.5px;line-height:1.5;color:var(--muted,inherit);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.newfaces{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px 4px}
.newfaces button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px;border:0;background:none;color:inherit;font:inherit;cursor:pointer;border-radius:10px;min-width:0}
.newfaces button:hover{background:rgba(120,140,200,.1)}
.newfaces img{width:40px;height:40px;border-radius:50%;transition:transform .2s}.newfaces button:hover img{transform:translateY(-2px) scale(1.06)}
.newfaces span{font-size:11.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.album-btn{display:block;margin:0 auto;padding:7px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.18);color:#fff;cursor:pointer;
  font:15px var(--hand);text-shadow:0 1px 6px rgba(8,20,70,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .2s}
.album-btn:hover{background:rgba(255,255,255,.32)}
/* 整本卡册 */
#album{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;padding:26px 40px 30px;background:rgba(12,26,74,.42);visibility:hidden}
#album[hidden]{display:none}
.al-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:#fff;margin:0 auto 18px;width:min(1240px,100%)}
.al-head h2{margin:0;font:30px/1 var(--hand);font-weight:normal;text-shadow:0 2px 12px rgba(8,20,70,.4)}
#alCount{font-size:13px;opacity:.85}
.al-sort{display:flex;gap:4px;padding:3px;border-radius:999px;background:rgba(255,255,255,.16);margin-left:auto}
.al-sort button{border:0;background:none;color:#fff;padding:4px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.al-sort button[aria-pressed="true"]{background:#fff;color:var(--ink)}
#alFind{width:200px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:13px;outline:none}
#alFind::placeholder{color:rgba(255,255,255,.7)}
.al-x{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center}
.al-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px;width:min(1240px,100%);margin:0 auto;padding:10px 6px 30px;align-content:start;scrollbar-width:thin}
.al-grid .mcard{width:auto}
/* 卡册里一百多张卡，镭射箔（混合模式）只在鼠标停的那张上画 */
.al-grid .mcard .holo{display:none}.al-grid .mcard:hover .holo{display:block}
.al-grid .mcard:hover{z-index:2}


/* ---------- 能动手的：按钮、开关 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:32px;padding:0 14px;border-radius:999px;border:1px solid transparent;background:var(--hair);color:#fff;cursor:pointer;font-size:13px;font-weight:600;
  box-shadow:0 1px 2px rgba(16,30,90,.2),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .12s,background .2s,box-shadow .2s;white-space:nowrap}
.btn .ic{width:15px;height:15px}
.btn:hover{background:#2752bd;box-shadow:0 4px 12px -2px color-mix(in srgb,var(--hair) 55%,transparent)}.btn:active{transform:translateY(1px)}
.btn.alt{background:#fff;color:var(--ink);border-color:var(--rule);box-shadow:0 1px 2px rgba(16,30,90,.08)}
.btn.alt:hover{border-color:#c7d6ec;background:var(--field)}
.btn.danger{background:#fff;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,#fff);box-shadow:none}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{height:28px;padding:0 12px;font-size:12.5px}
.btn[data-armed]{background:var(--blush);border-color:var(--blush);color:#fff;animation:armed .5s ease-in-out infinite alternate}
.btn.wait{opacity:.55;cursor:progress}
@keyframes armed{to{transform:scale(1.04)}}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
/* 开关一行一个：左边名字和说明，右边拨钮；同一类的放进一个圆角分组里 */
.group{border-radius:var(--r-md);background:var(--field);padding:0 12px;margin:0 0 4px}
.sw{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.sw + .sw{border-top:1px solid var(--line)}
.sw > span{flex:1;min-width:0;font-size:13.5px;font-weight:500}.sw small{display:block;color:var(--faint);font-size:11.5px;line-height:1.45;font-weight:400;margin-top:1px}
.sw input[type=checkbox]{position:absolute;opacity:0;width:1px;height:1px}
.sw i{flex:none;width:40px;height:24px;border-radius:999px;background:#cfd8ea;position:relative;transition:background .25s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(16,30,90,.3);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.sw input:checked + i{background:var(--good)}.sw input:checked + i::after{transform:translateX(16px)}
.sw input:focus-visible + i{outline:2px solid var(--hair);outline-offset:2px}
.sw select,.mtool select,.mg-acts select{flex:none;font:inherit;font-size:12.5px;color:var(--ink);height:28px;padding:0 26px 0 10px;border-radius:8px;border:1px solid var(--rule);background:#fff;cursor:pointer;
  -webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),linear-gradient(135deg,var(--soft) 50%,transparent 50%);
  background-position:calc(100% - 13px) 12px,calc(100% - 9px) 12px;background-size:4px 4px;background-repeat:no-repeat}
.sw.ro{cursor:default}
/* 11-02 重新归类：设定里按群、按人的表；群里页的开关状态；记录那条时间线按来源筛 */
.mx{width:100%;border-collapse:collapse;font-size:13px}
.mx th,.mx td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.mx tr:last-child td{border-bottom:0}
.mx th{font-weight:600;font-size:12.5px;color:var(--soft);white-space:nowrap}
.mx th small{display:block;font-weight:400;font-size:11px;color:var(--faint)}
.mx th:first-child,.mx td:first-child{text-align:left}
.mx td.off{opacity:.4}
.mx .who{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;min-width:0}
.mx button.who{cursor:pointer}.mx button.who:hover span{color:var(--hair)}
.mx .who img{width:26px;height:26px;border-radius:50%;flex:none}
.mx .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.sw.swc{display:inline-flex;padding:0;vertical-align:middle}
.sw.rt{cursor:default}.rt-t{font-style:normal;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint);white-space:nowrap}
.chip.on{color:var(--good);background:var(--good-soft)}
.gst{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 0}
.gst + .gst{border-top:1px solid var(--line)}
.gst b{flex:1;min-width:120px;font-weight:500;font-size:13.5px}
.tl li[hidden]{display:none}
.mchip .adot{width:8px;height:8px;border-radius:50%;background:var(--m)}
.tag.ann{margin-right:6px}
details.adv summary{cursor:pointer;font-size:12.5px;color:var(--soft);margin:10px 0 6px}
.card.flash{animation:cardflash 1.8s}
@keyframes cardflash{0%,45%{box-shadow:0 0 0 3px var(--warn),0 10px 30px rgba(16,30,90,.15)}}
/* 纸停一下就微微浮起来（GSAP 进出场时用的是行内 transform，不冲突） */
.col > .card:not(.bare){transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
@media (hover:hover){.col > .card:not(.bare):hover{transform:translateY(-3px);box-shadow:var(--sh-card),0 16px 36px rgba(16,30,90,.12)}}
@media (prefers-reduced-motion:reduce){.col > .card:not(.bare):hover{transform:none}}

/* 没东西时贴一张表情包 */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 4px;color:var(--soft)}
.empty img{width:84px;height:84px;object-fit:contain;transform:rotate(-3deg);border:4px solid #fff;border-radius:6px;box-shadow:0 4px 12px -2px rgba(16,30,90,.2);background:#fff}
.empty p{margin:8px 0 0;font-size:13px}
.loading{color:var(--soft);font-size:13px}

/* ---------- 窄屏：从上往下排，能滚动 ---------- */
@media (max-height:820px) and (min-width:1101px){
  #stage{top:-4px}
  #thought{top:calc(50% - 106px)}
}
@media (max-width:1100px){
  :root{--col:auto}
  body{overflow:auto}
  body > header{position:absolute;left:16px;right:16px}
  .brand{font-size:19px;white-space:nowrap}.brand-mark{width:32px;height:32px}.brand small{display:none}
  #clock{display:none}
  #kpi{position:relative;left:auto;right:auto;top:auto;margin:84px 16px 0;flex-wrap:wrap}
  .kpi-name{width:100%}.kpi-pad{display:none}
  .kpis{flex-wrap:wrap;justify-content:flex-start}.kpi{flex:1 1 40%;max-width:none}
  #thought{position:absolute;top:auto;bottom:calc(100% - 30px);transform:translateX(-50%);max-width:86vw;font-size:14px}
  #stage{position:relative;left:auto;right:auto;top:auto;bottom:auto;margin:96px auto 0;width:min(520px,96vw);height:auto;aspect-ratio:1/1.05}
  html:not(.geek) #thought{position:absolute;top:auto;bottom:6%;width:min(560px,92vw);font-size:14px}
  .col{position:relative;top:auto;bottom:auto;left:auto!important;right:auto!important;width:auto;overflow:visible;margin:0 8px;padding:10px 8px;-webkit-mask:none;mask:none}
  #dock{position:fixed;gap:2px;bottom:8px;max-width:calc(100vw - 16px);overflow-x:auto;padding:8px 8px}
  .orb{width:50px;flex:none}.orb i{width:40px;height:40px}.orb[aria-current="true"] i{width:46px;height:46px}.orb span,.orb[aria-current="true"] span{font-size:11.5px}
  main{padding-bottom:110px}
  .more{display:none}
}
@media (prefers-reduced-motion:reduce){#thought .caret,.sk,#thought::after{animation:none}.orb{transition:none}}

/* 神谕 · Oraculum：代码坏掉、字符往外漏的味道（紙面和極客都吃這套，極客另有覆蓋） */
.sw.sw-oracle{position:relative;margin:4px 0 8px;padding:13px 12px 12px 14px;border-radius:10px;overflow:hidden;
  background:radial-gradient(120% 140% at 8% 0%,#1c0510 0%,#0a0206 55%,#050103 100%);
  border:1px solid rgba(255,38,72,.38);box-shadow:0 0 22px -8px rgba(255,20,60,.7),inset 0 0 30px -16px #ff2038;color:#ffdfe6}
.sw.sw-oracle>span{position:relative;z-index:2;letter-spacing:.35px;
  text-shadow:1px 0 rgba(255,26,70,.65),-1px 0 rgba(40,220,255,.25);animation:oracleGlitch 4.2s steps(1) infinite}
.sw.sw-oracle small{color:#ff97aa;opacity:.92}
.sw.sw-oracle i{background:rgba(255,40,70,.16)!important;box-shadow:inset 0 0 0 1px rgba(255,40,70,.55)}
.sw.sw-oracle input:checked+i{background:linear-gradient(180deg,#ff5670,#d21230)!important;
  box-shadow:0 0 16px 1px rgba(255,40,70,.9),inset 0 0 0 1px rgba(255,255,255,.45)}
.sw.sw-oracle input:checked+i::after{background:#fff;box-shadow:0 0 10px #fff,0 0 18px #ff3355}
.sw.sw-oracle.on{animation:oraclePulse 2.8s ease-in-out infinite;
  background:radial-gradient(120% 140% at 8% 0%,#3a0616 0%,#14030a 55%,#0a0206 100%)}
.sw.sw-oracle.on::after{content:"// ORACLE ACTIVE";position:absolute;right:12px;top:7px;z-index:3;
  font:9px/1 ui-monospace,Menlo,monospace;letter-spacing:1.4px;color:#ff5a75;text-shadow:0 0 8px rgba(255,30,70,.9)}
.sw.sw-oracle.on>span{animation-duration:1.1s}
.sw.sw-oracle .lk{position:absolute;z-index:1;font:9px/1 ui-monospace,Menlo,monospace;color:rgba(255,62,92,.5);
  pointer-events:none;white-space:nowrap;text-shadow:0 0 6px rgba(255,20,60,.6);animation:oracleLeak 5.6s linear infinite}
.sw.sw-oracle .lk0{left:2%;bottom:-2px;animation-delay:-.2s}
.sw.sw-oracle .lk1{left:24%;bottom:-6px;animation-delay:-1.6s;color:rgba(255,90,120,.38)}
.sw.sw-oracle .lk2{right:56px;top:-3px;animation-delay:-2.9s;animation-direction:reverse}
.sw.sw-oracle .lk3{right:10px;bottom:-4px;animation-delay:-4.1s;color:rgba(255,40,80,.42)}
.sw.sw-oracle.on .lk{color:rgba(255,70,100,.72);text-shadow:0 0 10px rgba(255,20,60,.9)}
@keyframes oracleLeak{0%{transform:translateY(2px) skewX(0);opacity:0}8%{opacity:.9}45%{transform:translateY(-9px) skewX(-12deg);opacity:.55}
  70%{transform:translateY(3px) skewX(9deg);opacity:.85}100%{transform:translateY(12px) skewX(0);opacity:0}}
@keyframes oracleGlitch{0%,92%,100%{transform:none;filter:none}
  93%{transform:translateX(-1.5px) skewX(-6deg);filter:brightness(1.6)}
  95%{transform:translateX(2px) skewX(5deg)}
  97%{transform:translateX(-1px)}}
@keyframes oraclePulse{0%,100%{box-shadow:0 0 22px -8px rgba(255,20,60,.7),inset 0 0 30px -16px #ff2038}
  50%{box-shadow:0 0 30px -4px rgba(255,20,60,.95),inset 0 0 40px -12px #ff2038,0 0 60px -18px rgba(255,0,50,.8)}}
